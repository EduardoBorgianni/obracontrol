name: Gerar APK de teste
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Criar estrutura Android
        run: flutter create --project-name obracontrol --platforms android .
      - name: Baixar dependencias
        run: flutter pub get
      - name: Compilar APK de teste
        run: flutter build apk --debug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ObraControl-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
